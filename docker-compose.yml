services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: crafthub
      MYSQL_USER: crafthub
      MYSQL_PASSWORD: crafthubpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8080:5000"
    volumes:
      - ./config.py:/app/config.py:ro
      - ./app/static/img:/app/static/img:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
