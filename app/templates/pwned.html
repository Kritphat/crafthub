<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYSTEM LOCKED</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #050806;
      color: #27ff6a;
      font-family: "Courier New", monospace;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      overflow: hidden;
      animation: flicker 3s infinite;
    }
    @keyframes flicker { 0%,97%,100% { opacity: 1; } 98% { opacity: .82; } 99% { opacity: .95; } }
    .skull { font-size: clamp(70px, 18vw, 150px); line-height: 1; filter: drop-shadow(0 0 18px #27ff6a); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    h1 {
      font-size: clamp(28px, 7vw, 64px);
      letter-spacing: 3px; margin: 16px 0 6px;
      text-shadow: 2px 0 #ff2d2d, -2px 0 #00e6ff;
      animation: glitch .4s infinite;
    }
    @keyframes glitch {
      0% { text-shadow: 2px 0 #ff2d2d, -2px 0 #00e6ff; }
      50% { text-shadow: -2px 0 #ff2d2d, 2px 0 #00e6ff; }
      100% { text-shadow: 2px 0 #ff2d2d, -2px 0 #00e6ff; }
    }
    .taunt {
      font-size: clamp(18px, 4.5vw, 30px);
      font-weight: 700; color: #ffcc3a;
      border: 2px dashed #ffcc3a; border-radius: 8px;
      padding: 16px 22px; margin: 18px 0; max-width: 680px;
    }
    .sub { opacity: .75; max-width: 620px; font-size: 14px; line-height: 1.7; }
    .bar { width: min(560px, 90vw); height: 16px; border: 1px solid #27ff6a; border-radius: 10px; margin: 20px 0 6px; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; background: #27ff6a; animation: fill 6s linear forwards; }
    @keyframes fill { to { width: 100%; } }
    .pct { font-size: 13px; opacity: .7; }
    a.btn {
      margin-top: 26px; display: inline-block;
      color: #050806; background: #27ff6a; text-decoration: none;
      font-weight: 700; padding: 12px 26px; border-radius: 6px;
      letter-spacing: 1px;
    }
    a.btn:hover { background: #ffcc3a; }
    .wink { margin-top: 18px; font-size: 12px; opacity: .5; }
  </style>
</head>
<body>
  <div class="skull">💀</div>
  <h1>SYSTEM LOCKED</h1>
  <div class="taunt">{{ taunt }}</div>
  <div class="sub">All your files are belong to us</div>
  <div class="bar"><span></span></div>
  <a class="btn" href="{{ url_for('index') }}">จ่ายค่าไถ่คนสอนมาแล้วจะบอก flag</a>
</body>
</html>
