<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftHub{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="" class="logo">
      <span>CraftHub</span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('shop') }}">Shop</a>
      {% if session.get('is_admin') %}
        <a href="{{ url_for('players') }}">Players</a>
      {% endif %}
      {% if session.get('user') %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a class="btn-nav" href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <span>CraftHub Network. A community of builders. Server IP: 10.10.30.114</span>
  </footer>
</body>
</html>
