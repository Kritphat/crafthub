{% extends "base.html" %}
{% block title %} - Login{% endblock %}
{% block content %}
<div class="form-card">
  <img src="{{ url_for('static', filename='img/logo.png') }}" alt="CraftHub" class="login-logo">
  <h1>Member Login</h1>
  <p class="muted">Sign in to manage your CraftHub profile.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <label>Username</label>
    <input type="text" name="username" autocomplete="off" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="muted small">No account yet? <a href="{{ url_for('register') }}">Register here</a>.</p>
</div>
{% endblock %}
